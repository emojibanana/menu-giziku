name: Deploy ke GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Tanpa `convex codegen`: folder src/convex/_generated sudah di-commit.
      - name: Cek secret VITE_CONVEX_URL
        run: |
          if [ -z "${VITE_CONVEX_URL:-}" ]; then
            echo "::error::Secret VITE_CONVEX_URL belum diset (Settings → Secrets and variables → Actions)"
            exit 1
          fi
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}

      - name: Build (base relatif agar aman di subpath GitHub Pages)
        run: bunx vite build --base=./
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}

      - name: SPA fallback (salin index.html ke 404.html)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
